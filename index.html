<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>김춘식 데이트 맵</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3B4C6B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="데이트 맵">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=3">
<link rel="apple-touch-icon" href="icon-192.png?v=3">
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:root{--cream:#FAFAF7;--warm:#EEEBE5;--brown:#8B7E74;--dark:#3B4C6B;--green:#2D8659;--red:#E05252;--accent:#5B7DB8;--card-shadow:0 1px 4px rgba(0,0,0,.06)}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;font-weight:450;background:var(--dark);color:#333;height:100dvh;height:100vh;display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top, 0px)}
@supports(height:100dvh){body{height:100dvh}}
header{background:linear-gradient(135deg,#3B4C6B,#4E6490);color:#fff;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
header h1{font-family:'Pretendard Variable',Pretendard,sans-serif;font-size:17px;font-weight:700;letter-spacing:-.3px}
.badge{font-size:12px;background:rgba(255,255,255,.15);backdrop-filter:blur(4px);color:white;padding:4px 12px;border-radius:20px;display:flex;align-items:center;gap:5px}
.dot{width:6px;height:6px;background:#7FD49A;border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes locPulse{0%{transform:scale(1);opacity:.5}100%{transform:scale(2.2);opacity:0}}
.main{display:flex;flex:1;overflow:hidden}
.panel{width:320px;background:var(--cream);border-right:1px solid var(--warm);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
#map{flex:1;background:#e8e0d8;touch-action:auto}
.tabs{display:flex;border-bottom:1px solid var(--warm);flex-shrink:0;background:white}
.tab{flex:1;padding:11px 2px;text-align:center;font-size:13px;font-weight:550;color:var(--brown);cursor:pointer;border:none;border-bottom:2.5px solid transparent;background:none;transition:all .2s}
.tab.active{color:var(--dark);border-bottom-color:var(--accent);font-weight:650}
.tab-content{display:none;flex:1;overflow:hidden;flex-direction:column}
.tab-content.active{display:flex}
/* 공통 인풋 */
input,select,textarea{font-family:'Pretendard Variable',Pretendard,sans-serif;font-size:14px;border:1px solid #e0e0e0;border-radius:10px;padding:9px 12px;background:white;color:#333;outline:none;transition:all .2s;width:100%;margin-bottom:6px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,125,184,.15)}
.lbl{font-size:12px;font-weight:600;color:var(--dark);margin-bottom:4px;margin-top:10px}
.lbl:first-child{margin-top:0}
.row{display:flex;gap:6px}
.row input,.row select{margin-bottom:0}
.btn{font-family:'Pretendard Variable',Pretendard,sans-serif;font-size:13px;font-weight:550;padding:9px 16px;border-radius:10px;border:none;cursor:pointer;transition:all .2s;white-space:nowrap}
.btn-dark{background:var(--dark);color:white}
.btn-dark:hover{background:#4E6490;transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.btn-outline{background:white;border:1px solid #e0e0e0;color:var(--brown)}
.btn-outline:hover{border-color:var(--brown);background:#fafafa}
.btn-sm{font-size:12px;padding:5px 12px}
/* 검색 */
.add-wrap{padding:12px;overflow-y:auto;flex:1}
.sr-item{padding:8px 10px;border:1px solid var(--warm);border-radius:6px;margin-bottom:5px;cursor:pointer;font-size:13px;transition:all .15s}
.sr-item:hover{border-color:var(--brown);background:var(--cream)}
.sr-name{font-weight:500;margin-bottom:2px}
.sr-addr{color:var(--brown);font-size:12px}
.search-loading{font-size:13px;color:var(--brown);padding:6px;text-align:center}
/* 목록 */
.filter-bar{display:flex;gap:4px;padding:8px 8px 4px;flex-wrap:wrap;flex-shrink:0}
.fb{font-size:12px;padding:4px 9px;border-radius:20px;border:1px solid var(--warm);background:white;color:var(--brown);cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:3px}
.fb svg{width:13px;height:13px;vertical-align:middle;flex-shrink:0;overflow:visible}
.fb.active{background:var(--dark);color:white;border-color:var(--dark)}
.place-list{flex:1;overflow-y:auto;padding:8px}
.pi{background:white;border:1px solid transparent;border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:all .2s;box-shadow:var(--card-shadow)}
.pi:hover{box-shadow:0 3px 12px rgba(0,0,0,.1);transform:translateY(-1px)}
.pi.sel{border-color:var(--accent);background:#F0F3F9;box-shadow:0 2px 12px rgba(91,125,184,.15)}
.pi-top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.pi-name{font-size:14px;font-weight:550;flex:1}
.pi-cat{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:500;flex-shrink:0;cursor:pointer;display:inline-flex;align-items:center;gap:2px;overflow:hidden;max-width:90px;max-height:22px;line-height:16px;white-space:nowrap;text-overflow:ellipsis}
.pi-cat svg{width:12px;height:12px;vertical-align:middle;flex-shrink:0;overflow:visible}
.pi-addr{font-size:12px;color:var(--brown);margin-top:3px;display:flex;align-items:center;gap:2px}
.pi-addr .lc svg{width:11px;height:11px}
.pi-dist .lc svg{width:11px;height:11px}
.pi-memo{font-size:12px;color:#999;margin-top:3px;font-style:italic}
.addr-search{color:var(--brown);font-size:9px;font-weight:500;cursor:pointer;margin-left:4px;background:var(--cream);border:1px solid var(--warm);border-radius:4px;padding:1px 6px;display:inline-block;vertical-align:middle}
.addr-search:hover{background:var(--warm);color:var(--dark)}
.pi-acts{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap}
.bx{font-size:12px;padding:4px 10px;border-radius:8px;border:1px solid #eee;background:#fafafa;cursor:pointer;color:#666;transition:all .15s;font-family:'Pretendard Variable',Pretendard,sans-serif;display:inline-flex;align-items:center;gap:3px}
.bx:hover{border-color:var(--brown);color:var(--brown);background:white}
.bx.vis{background:var(--green);color:white;border-color:var(--green)}
.bx.del:hover{border-color:var(--red);color:var(--red);background:#FFF5F5}
/* 별점 */
.pi-rating{margin-top:6px;font-size:12px;color:var(--brown)}
.pi-rating-avg{font-weight:600;color:var(--dark);font-size:13px;margin-bottom:2px}
.pi-rating-row{display:flex;align-items:center;gap:4px;margin-bottom:2px}
.pi-rating-name{font-size:11px;color:var(--brown);min-width:36px}
.star{cursor:pointer;transition:transform .1s;display:inline-flex;vertical-align:middle}
.star:hover{transform:scale(1.3)}
.star svg{width:16px;height:16px}
.star.on svg{fill:#F1C40F;stroke:#E6B800}
.star.off svg{fill:#e0e0e0;stroke:#ccc}
/* 설정/공유 */
.cfg-wrap{padding:14px;overflow-y:auto;flex:1}
.s-title{font-size:14px;font-weight:650;margin-bottom:4px}
.s-desc{font-size:12px;color:var(--brown);margin-bottom:8px;line-height:1.5}
.code-box{background:var(--cream);border:1px solid var(--warm);border-radius:6px;padding:10px;font-size:10px;font-family:monospace;word-break:break-all;max-height:56px;overflow-y:auto;margin-bottom:6px;color:var(--dark)}
hr.div{border:none;border-top:1px solid var(--warm);margin:14px 0}
/* 카테고리 편집 */
.cat-list{margin-bottom:8px}
.cat-row{display:flex;align-items:center;gap:8px;margin-bottom:4px;background:var(--cream);border-radius:8px;padding:8px 10px;position:relative;transition:transform 0.15s,box-shadow 0.15s}
.cat-emoji{font-size:18px;cursor:pointer;min-width:26px;text-align:center;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.cat-emoji svg{width:20px;height:20px}
.cat-name-input{flex:1;margin-bottom:0;font-size:14px;padding:5px 8px;border-radius:6px;border:1px solid var(--warm);background:white}
.cat-color-btn{width:28px;height:28px;border-radius:50%;border:2px solid white;box-shadow:0 0 0 1px var(--warm);cursor:pointer;flex-shrink:0}
.cat-palette{display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:white;border-radius:8px;border:1px solid var(--warm);margin-top:4px;margin-bottom:4px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.cat-palette span{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .1s}
.cat-palette span:hover{transform:scale(1.2)}
.cat-palette span.sel{border-color:var(--dark);transform:scale(1.15)}
.cat-handle{cursor:grab;color:var(--brown);font-size:16px;padding:4px 6px;flex-shrink:0;touch-action:none;user-select:none;-webkit-user-select:none}
.cat-handle:active{cursor:grabbing}
.cat-row.dragging{opacity:.4;background:var(--warm);transform:scale(0.95)}
.cat-row.drag-over{box-shadow:0 -3px 0 0 var(--accent);background:#EEF0FF;border:1px dashed var(--accent);transition:all 0.15s}
.cat-row.touch-dragging{z-index:100;box-shadow:0 4px 16px rgba(0,0,0,0.3);transform:scale(1.04);background:white;opacity:.95;border:1px solid var(--accent)}
.cat-del{background:none;border:none;cursor:pointer;color:#ccc;font-size:15px;padding:4px 6px;flex-shrink:0}
.cat-del:hover{color:var(--red)}
.cat-summary-item{display:inline-flex;align-items:center;gap:3px;font-size:12px;padding:3px 8px;border-radius:12px;margin:2px;border:1px solid var(--warm);background:white}
.cat-summary-item svg{width:12px;height:12px}
.save-success{background:var(--green) !important;border-color:var(--green) !important}
/* 지도 정보창 버튼 */
.iw-btn{font-family:'Pretendard Variable',Pretendard,sans-serif;font-size:12px;padding:3px 6px;border-radius:6px;border:1px solid #ddd;background:white;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:2px;white-space:nowrap;min-width:28px;min-height:28px}
.iw-btn svg{width:14px;height:14px;flex-shrink:0}
.iw-btn:hover{background:#f5f0e8;border-color:#8B6F5E}
/* 모달 - 카테고리 변경 */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:1000;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:white;border-radius:16px;padding:20px;width:280px;max-height:80vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.modal h3{font-size:15px;font-weight:600;margin-bottom:12px}
.modal-cat-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;cursor:pointer;transition:background .15s}
.modal-cat-item:hover{background:var(--cream)}
.modal-cat-dot{width:10px;height:10px;border-radius:50%}
.modal-cat-name{font-size:14px;display:inline-flex;align-items:center;gap:4px}
.modal-cat-name svg{width:14px;height:14px}
.modal-close{margin-top:10px;width:100%;padding:8px;border:1px solid var(--warm);border-radius:6px;background:white;cursor:pointer;font-size:13px;color:var(--brown)}
/* 빈 상태 */
.empty{text-align:center;padding:40px 16px;color:var(--brown)}
.empty .ico{font-size:36px;margin-bottom:10px}
.empty p{font-size:13px;line-height:1.7}
/* 내 위치 버튼 */
.my-loc-btn{position:absolute;top:12px;right:12px;z-index:10;width:40px;height:40px;border-radius:50%;background:white;border:1px solid var(--warm);box-shadow:0 2px 8px rgba(0,0,0,.15);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.my-loc-btn:hover{background:var(--cream);box-shadow:0 2px 12px rgba(0,0,0,.2)}
.my-loc-btn.tracking{background:#4285F4;color:white;border-color:#4285F4;box-shadow:0 0 12px rgba(66,133,244,.4)}
.pi-dist{font-size:10px;color:var(--green);margin-top:2px;font-weight:500}
/* lucide 아이콘 */
.lc{display:inline-flex;align-items:center;vertical-align:middle}
.lc svg{width:18px;height:18px;stroke-width:2}
.lc-sm svg{width:15px;height:15px}
.lc-lg svg{width:22px;height:22px}
header .lc svg{width:18px;height:18px}
.tab .lc svg{width:15px;height:15px}
.my-loc-btn .lc svg{width:20px;height:20px}
.empty .lc svg{width:36px;height:36px;stroke-width:1.5}
/* 목록 상단 검색/추가 바 */
.list-top-bar{padding:8px 10px 4px;flex-shrink:0;border-bottom:1px solid var(--warm);background:white}
.list-search-row{display:flex;gap:6px;align-items:center}
.list-search-box{display:flex;align-items:center;gap:6px;background:var(--cream);border:1px solid var(--warm);border-radius:10px;padding:6px 10px;transition:all .2s;overflow:hidden}
.list-search-box.collapsed{width:34px;height:34px;padding:0;cursor:pointer;flex:0 0 34px;justify-content:center}
.list-search-box.collapsed .lc svg{width:17px;height:17px}
.list-search-box.expanded{flex:1}
.list-search-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,125,184,.15)}
.list-search-box input{font-size:13px}
.list-search-box.collapsed input{display:none}
.add-toggle-btn{display:flex;align-items:center;gap:3px;border-radius:10px !important;padding:7px 14px !important}
.add-panel{border-bottom:1px solid var(--warm);background:#FAFAF7;display:none;max-height:50vh;overflow:hidden}
.add-panel.open{display:flex;flex-direction:column}
/* 주변 검색 */
.nearby-bar{position:absolute;top:12px;left:12px;z-index:10;display:flex;gap:4px;flex-wrap:wrap;max-width:calc(100% - 70px);transition:opacity .2s,visibility .2s}
.nearby-bar.hidden{opacity:0;pointer-events:none;visibility:hidden}
.nb-btn{font-family:'Pretendard Variable',Pretendard,sans-serif;font-size:12px;padding:5px 10px;border-radius:20px;border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.92);backdrop-filter:blur(6px);color:#333;cursor:pointer;box-shadow:0 1px 6px rgba(0,0,0,.12);transition:all .15s;white-space:nowrap}
.nb-btn svg{width:18px;height:18px;flex-shrink:0;vertical-align:middle}
.nb-btn:hover,.nb-btn.active{background:var(--accent);color:white;border-color:var(--accent)}
/* 토스트 */
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom, 0px));left:50%;transform:translateX(-50%) translateY(120px);background:rgba(59,76,107,.92);backdrop-filter:blur(8px);color:white;padding:11px 22px;border-radius:14px;font-size:14px;transition:transform .3s,opacity .3s;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.2);opacity:0;pointer-events:none;white-space:nowrap;max-width:90vw;text-overflow:ellipsis;overflow:hidden}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
@media(max-width:680px){
  .main{flex-direction:column}
  .panel{width:100%;height:48dvh;height:48vh;border-right:none;border-bottom:1px solid var(--warm)}
  #map{height:52dvh;height:52vh}
  .my-loc-btn{top:10px;right:10px;width:38px;height:38px}
}
@supports(height:100dvh){
  @media(max-width:680px){
    .panel{height:48dvh}
    #map{height:52dvh}
  }
}
</style>
<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js"></script>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>
<header>
  <h1><img src="icon-192.png?v=3" width="22" height="22" style="vertical-align:middle;margin-right:4px;border-radius:4px"> 김춘식 데이트 맵</h1>
  <div class="badge" onclick="openPlaceListModal()" style="cursor:pointer"><div class="dot"></div><span id="cnt">0</span>개 장소</div>
</header>
<div class="main">
  <div class="panel">
    <div class="tabs">
      <button class="tab active" onclick="showTab('list')"><i data-lucide="list" class="lc lc-sm"></i> 목록</button>
      <button class="tab" onclick="showTab('cfg')"><i data-lucide="settings" class="lc lc-sm"></i> 설정</button>
    </div>

    <!-- 목록+추가 통합 탭 -->
    <div id="tab-list" class="tab-content active">
      <!-- 검색/추가 토글 영역 -->
      <div class="list-top-bar">
        <div class="list-search-row">
          <div class="list-search-box collapsed" id="listSearchBox" onclick="expandListSearch()">
            <i data-lucide="search" class="lc lc-sm" style="color:var(--brown);flex-shrink:0"></i>
            <input id="listSearchInput" type="text" placeholder="등록된 장소 검색 (예: ㅅㅂㅅ)" oninput="filterListSearch()" onblur="collapseListSearch()" onclick="event.stopPropagation()" style="border:none;padding:4px 0;margin:0;background:none;flex:1;min-width:0">
          </div>
          <button class="btn btn-dark btn-sm add-toggle-btn" id="addToggleBtn" onclick="toggleAddPanel()"><i data-lucide="plus" class="lc lc-sm"></i> 추가</button>
        </div>
      </div>
      <!-- 장소 추가 패널 (접이식) -->
      <div id="addPanel" class="add-panel">
        <div class="add-wrap" style="padding:10px 12px">
          <div class="lbl" style="margin-top:0"><i data-lucide="search" class="lc lc-sm"></i> 카카오 장소 검색</div>
          <div class="row" style="margin-bottom:6px">
            <input id="sq" type="text" placeholder="예: 안국 한옥카페" onkeydown="if(event.key==='Enter')doSearch()">
            <button class="btn btn-dark btn-sm" style="flex-shrink:0;margin-bottom:0" onclick="doSearch()">검색</button>
          </div>
          <div id="srBatchBar" style="display:none;background:var(--accent);color:white;padding:8px 12px;border-radius:8px;margin-bottom:6px;align-items:center;justify-content:space-between;cursor:pointer;position:sticky;top:0;z-index:10;box-shadow:0 2px 6px rgba(0,0,0,.15)" onclick="showBatchConfirm()">
            <span id="srBatchCount" style="font-size:13px;font-weight:550"></span>
            <span style="font-size:12px;background:rgba(255,255,255,.25);padding:4px 12px;border-radius:6px">추가하기</span>
          </div>
          <div id="sr"></div>
          <div id="searchConfirm" style="display:none;background:var(--cream);border:1px solid var(--warm);border-radius:8px;padding:12px;margin-top:6px;position:sticky;top:0;z-index:10;box-shadow:0 2px 6px rgba(0,0,0,.1)">
            <div style="font-size:13px;font-weight:500;margin-bottom:2px" id="scName"></div>
            <div style="font-size:11px;color:var(--brown);margin-bottom:8px" id="scAddr"></div>
            <div class="lbl" style="margin-top:0">카테고리</div>
            <select id="scCat" style="margin-bottom:6px"></select>
            <div class="lbl" style="margin-top:0">메모</div>
            <textarea id="scMemo" rows="2" placeholder="영업시간, 예약여부 등" style="resize:none"></textarea>
            <div class="row" style="margin-top:6px">
              <button class="btn btn-outline" style="flex:1" onclick="cancelSearch()">취소</button>
              <button class="btn btn-dark" style="flex:1" id="scConfirmBtn" onclick="confirmSearch()">추가하기</button>
            </div>
          </div>
          <hr class="div" style="margin:8px 0">
          <div class="lbl" style="margin-top:0"><i data-lucide="pencil" class="lc lc-sm"></i> 직접 입력</div>
          <input id="mName" type="text" placeholder="장소 이름 *">
          <input id="mAddr" type="text" placeholder="주소 (선택 — 지도 핀 위치용)">
          <div class="lbl" style="margin-top:0">카테고리</div>
          <select id="mCat" style="margin-bottom:6px"></select>
          <div class="lbl" style="margin-top:0">메모</div>
          <textarea id="mMemo" rows="2" placeholder="영업시간, 예약여부 등" style="resize:none"></textarea>
          <button class="btn btn-dark" style="width:100%" onclick="addManual()">추가하기</button>
        </div>
      </div>
      <div class="filter-bar" id="filterBar">
        <button class="fb active" onclick="setFilter(this,'전체')">전체</button>
      </div>
      <div id="myLocStatus" style="display:none;padding:6px 12px;font-size:11px;color:var(--green);background:#e8f5e9;border-bottom:1px solid var(--warm);display:flex;align-items:center;gap:6px"></div>

<script>
// ── Firebase 초기화 ──
firebase.initializeApp({
  apiKey: "AIzaSyAF6096bC-Q04qWXh5MjVsuJGhYBy76agM",
  authDomain: "datemap-759bf.firebaseapp.com",
  projectId: "datemap-759bf",
  storageBucket: "datemap-759bf.firebasestorage.app",
  messagingSenderId: "833273999923",
  appId: "1:833273999923:web:2696d0363c223c6bbbe946"
});
const db = firebase.firestore();
const docRef = db.collection('datemap').doc('shared');

// ── 기본 카테고리 ──
const DEFAULT_CATS = [
  { id:'식사', name:'식사', emoji:'fork', color:'#FFB3B3' },
  { id:'카페', name:'카페', emoji:'coffee', color:'#B5D8A8' },
  { id:'산책', name:'산책', emoji:'leaf', color:'#A8D4E6' },
  { id:'활동', name:'활동', emoji:'bike', color:'#D4B3E8' },
  { id:'기타', name:'기타', emoji:'pin', color:'#D5D5D5' },
];

let places = [], cats = [...DEFAULT_CATS];
let markers = [], iws = [], iwMap = {}, map, curFilter = '전체';
let editingPlaceId = null;
let myNick = localStorage.getItem('datemap-nick') || '';
let myLocMarker = null, myLocOverlay = null, watchId = null, myLat = null, myLng = null;
let firestoreReady = false;

const REST_KEY = 'f05925b16ad652c4bb02b5aac5e56b06';

// ── 이모지→SVG키 마이그레이션 ──
const EMOJI_TO_SVG = {
  // 맛집 계열 → fork
  '🍽':'fork','🍽️':'fork','🍜':'fork','🍕':'fork','🍔':'fork','🍣':'fork','🍲':'fork','🥩':'fork','🍱':'fork',
  // 카페 계열 → coffee
  '☕':'coffee','🥐':'coffee','🍰':'coffee','🧁':'coffee','🍦':'coffee','🍩':'coffee',
  // 술/바 → bar
  '🍺':'bar','🍷':'bar','🍸':'bar','🥂':'bar',
  // 놀거리 → play
  '🎬':'play','🎵':'play','🎮':'play','🎤':'play','🎧':'play','🎪':'play','🎭':'play',
  // 자연/산책 → leaf
  '🌿':'leaf','🌳':'leaf','🌊':'leaf','⛰️':'leaf','⛰':'leaf','🏖️':'leaf','🏖':'leaf','🌸':'leaf','🍀':'leaf',
  // 쇼핑 → bag
  '🛍️':'bag','🛍':'bag','👗':'bag','👟':'bag','💇':'bag','💇‍♀️':'bag',
  // 운동 → target
  '💪':'target','🏊':'target','⚽':'target','🚴':'target','⛳':'target','🎯':'target',
  // 기타
  '📸':'cam','🎨':'cam','📚':'pin','🏛️':'pin','🏛':'pin',
  '🏠':'home','✈️':'pin','✈':'pin','🚗':'pin','🚆':'pin',
  '💑':'heart','💝':'heart','🎁':'heart','🎂':'heart','💍':'heart',
  '🐶':'pin','🐱':'pin','💊':'pin','🏥':'pin',
  '📌':'pin','⭐':'star','❤️':'heart','❤':'heart','🔥':'star','✨':'star',
  // 이전 SVG키 → 현재 키 매핑
  'noodle':'fork','pizza':'fork','burger':'fork','sushi':'fork','rice':'fork','meat':'fork','bento':'fork',
  'croissant':'bread','cake':'bread','icecream':'bread','donut':'bread',
  'beer':'fork','wine':'fork','cocktail':'fork','bar':'fork',
  'movie':'star','music':'star','game':'star','mic':'star','headphone':'star','theater':'star','play':'star',
  'tree':'leaf','wave':'leaf','mountain':'leaf','beach':'leaf','flower':'leaf','clover':'leaf',
  'dress':'bag','shoe':'bag','scissors':'bag',
  'gym':'bike','swim':'bike','soccer':'bike','target':'bike','golf':'bike',
  'palette':'star','book':'pin','museum':'pin','cam':'star',
  'plane':'pin','car':'pin','train':'pin',
  'couple':'heart','gift':'heart','birthday':'heart','ring':'heart',
  'dog':'pin','cat':'pin','pill':'pin','hospital':'pin',
  'heartfill':'heart','fire':'star','sparkle':'star',
};
function migrateCats() {
  let changed = false;
  cats.forEach(c => {
    if (c.emoji && EMOJI_TO_SVG[c.emoji]) {
      c.emoji = EMOJI_TO_SVG[c.emoji];
      changed = true;
    }
    // raw SVG 문자열도 키로 변환
    if (c.emoji && c.emoji.includes && c.emoji.includes('<svg')) {
      // SVG 내용으로 매칭
      if (c.emoji.includes('fork') || (c.emoji.includes('M3 2v7') && c.emoji.includes('M7 2v20'))) c.emoji = 'fork';
      else if (c.emoji.includes('#8B4513') || c.emoji.includes('#6F4E37') || c.emoji.includes('M17 8h1a4')) c.emoji = 'coffee';
      else if (c.emoji.includes('#27AE60') || c.emoji.includes('#1E8449')) c.emoji = 'leaf';
      else if (c.emoji.includes('circle cx="12" cy="12" r="10"') && c.emoji.includes('r="6"') && c.emoji.includes('r="2"')) c.emoji = 'target';
      else if (c.emoji.includes('M21 10c0 7-9 13')) c.emoji = 'pin';
      else if (c.emoji.includes('croissant') || c.emoji.includes('#D4A017')) c.emoji = 'croissant';
      else if (c.emoji.includes('#9B59B6') && c.emoji.includes('M4 2l8')) c.emoji = 'fork';
      else if (c.emoji.includes('M6 2L3 6v14')) c.emoji = 'bag';
      else if (c.emoji.includes('M23 19a2')) c.emoji = 'star';
      else if (c.emoji.includes('#FF6B81') || c.emoji.includes('20.84 4.61')) c.emoji = 'heart';
      else if (c.emoji.includes('M9 18V5l12')) c.emoji = 'star';
      else if (c.emoji.includes('M6.5 6.5h11')) c.emoji = 'bike';
      else if (c.emoji.includes('M8 10 5.9 16')) c.emoji = 'leaf';
      else if (c.emoji.includes('M21 16v-2l-8-5')) c.emoji = 'pin';
      else if (c.emoji.includes('palette') || c.emoji.includes('cx="8" cy="9"')) c.emoji = 'star';
      else if (c.emoji.includes('E8A0BF') || c.emoji.includes('M12 2C8 6')) c.emoji = 'leaf';
      else if (c.emoji.includes('M4 16c0-2')) c.emoji = 'fork';
      else if (c.emoji.includes('M5 8h12v10')) c.emoji = 'fork';
      else if (c.emoji.includes('M3 9l9-7')) c.emoji = 'home';
      else if (c.emoji.includes('cx="5.5" cy="17.5"')) c.emoji = 'bike';
      else c.emoji = 'pin'; // 알 수 없는 SVG → 기본 핀
      changed = true;
    }
  });
  return changed;
}

// ── 스토리지 (Firestore + localStorage 백업) ──
function loadData() {
  // localStorage에서 먼저 로드 (오프라인/빠른 로딩용)
  try {
    const r1 = localStorage.getItem('datemap-v2');
    if (r1) places = JSON.parse(r1);
    const r2 = localStorage.getItem('datemap-cats');
    if (r2) cats = JSON.parse(r2);
  } catch(e) { places = []; cats = [...DEFAULT_CATS]; }
  // 이모지/SVG문자열 → SVG키 마이그레이션
  if (migrateCats()) { saveCatsData(); }
}

function saveData() {
  // localStorage 백업
  try { localStorage.setItem('datemap-v2', JSON.stringify(places)); } catch(e) {}
  // Firestore에 저장
  syncToFirestore();
}
function saveCatsData() {
  try { localStorage.setItem('datemap-cats', JSON.stringify(cats)); } catch(e) {}
  syncToFirestore();
}

function syncToFirestore() {
  docRef.set({ places: JSON.stringify(places), cats: JSON.stringify(cats) })
    .catch(e => console.log('Firestore 저장 실패:', e));
}

function startRealtimeSync() {
  docRef.onSnapshot(snap => {
    if (!snap.exists) return;
    const data = snap.data();
    try {
      const newPlaces = JSON.parse(data.places || '[]');
      const newCats = JSON.parse(data.cats || '[]');
      // 변경이 있을 때만 업데이트
      if (JSON.stringify(newPlaces) !== JSON.stringify(places) ||
          JSON.stringify(newCats) !== JSON.stringify(cats)) {
        places = newPlaces;
        cats = newCats.length ? newCats : [...DEFAULT_CATS];
        const migrated = migrateCats();
        // localStorage 백업
        try { localStorage.setItem('datemap-v2', JSON.stringify(places)); } catch(e) {}
        try { localStorage.setItem('datemap-cats', JSON.stringify(cats)); } catch(e) {}
        // 마이그레이션 결과 Firestore에도 반영
        if (migrated) syncToFirestore();
        renderAll();
      }
    } catch(e) {}
    firestoreReady = true;
  }, err => {
    console.log('Firestore 실시간 동기화 실패:', err);
  });
}

// ── 지도 초기화 ──
function initMap() {
  // 저장된 위치가 있으면 바로 사용
  const savedLoc = localStorage.getItem('datemap-lastloc');
  let initLat = 37.5665, initLng = 126.9780, initLevel = 5;
  if (savedLoc) {
    try { const loc = JSON.parse(savedLoc); initLat = loc.lat; initLng = loc.lng; initLevel = 4; } catch(e) {}
  }
  map = new kakao.maps.Map(document.getElementById('map'), {
    center: new kakao.maps.LatLng(initLat, initLng), level: initLevel
  });
  kakao.maps.event.addListener(map, 'click', () => closeAllIw());
  renderAll();
  // 앱 시작 시: savedLoc으로 즉시 마커+거리 표시
  document.getElementById('locBtn').classList.add('tracking');
  if (savedLoc) {
    try {
      const loc = JSON.parse(savedLoc);
      myLat = loc.lat; myLng = loc.lng;
      updateMyLocMarker();
      renderList();
    } catch(e) {}
  }
  // 즉시 GPS 시도 (모든 플랫폼)
  setTimeout(() => _silentGps(), 300);
  // iOS PWA 백업: 첫 터치 시에도 GPS 시도
  function _autoGps() {
    document.removeEventListener('touchstart', _autoGps);
    document.removeEventListener('click', _autoGps);
    if (watchId !== null) return;
    _silentGps();
  }
  document.addEventListener('touchstart', _autoGps, {once:true});
  document.addEventListener('click', _autoGps, {once:true});
}

function _silentGps() {
  if (!navigator.geolocation || watchId !== null) return;
  navigator.geolocation.getCurrentPosition(pos => {
    myLat = pos.coords.latitude;
    myLng = pos.coords.longitude;
    localStorage.setItem('datemap-lastloc', JSON.stringify({lat:myLat,lng:myLng}));
    updateMyLocMarker();
    map.setCenter(new kakao.maps.LatLng(myLat, myLng));
    map.setLevel(4);
    renderList();
    if (watchId === null) {
      watchId = navigator.geolocation.watchPosition(wp => {
        if (wp.coords.accuracy > 1000) return;
        myLat = wp.coords.latitude; myLng = wp.coords.longitude;
        updateMyLocMarker(); renderList();
      }, ()=>{}, {enableHighAccuracy:true, maximumAge:5000, timeout:15000});
    }
  }, () => {

  }, {enableHighAccuracy:true, timeout:10000});
}

// ── 자음(초성) 검색 지원 ──
const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function getChosung(str) {
  return [...str].map(c => { const code = c.charCodeAt(0) - 0xAC00; return code >= 0 && code <= 11171 ? CHO[Math.floor(code / 588)] : c; }).join('');
}
function matchChosung(text, query) {
  if (!text || !query) return false;
  const tLow = text.toLowerCase();
  const qLow = query.toLowerCase();
  // 일반 포함 검색
  if (tLow.includes(qLow)) return true;
  // 초성 검색 (쿼리가 자음으로만 이루어진 경우)
  const isAllCho = [...qLow].every(c => CHO.includes(c));
  if (isAllCho) {
    const cho = getChosung(text);
    return cho.includes(qLow);
  }
  return false;
}

// ── 카카오 REST API 검색 (CORS 우회용 프록시 없이 직접) ──
let _searchPage = 1;
let _searchQuery = '';
let _searchEnd = false;

async function doSearch(append) {
  const q = append ? _searchQuery : document.getElementById('sq').value.trim();
  if (!q) return;
  const box = document.getElementById('sr');
  if (!append) {
    _searchPage = 1;
    _searchQuery = q;
    _searchEnd = false;
    window._sd = [];
    window._srChecked = new Set();
    box.innerHTML = '<div class="search-loading">🔍 검색 중...</div>';
  }
  try {
    let url = `https://dapi.kakao.com/v2/local/search/keyword.json?query=${encodeURIComponent(q)}&size=5&page=${_searchPage}`;
    if (myLat !== null) url += `&y=${myLat}&x=${myLng}&sort=distance`;
    const res = await fetch(url, {
      headers: { 'Authorization': `KakaoAK ${REST_KEY}` }
    });
    const data = await res.json();
    if (!data.documents || !data.documents.length) {
      if (!append) box.innerHTML = '<div class="search-loading">결과가 없어요</div>';
      _searchEnd = true;
      return;
    }
    const startIdx = window._sd.length;
    window._sd.push(...data.documents);
    _searchEnd = data.meta.is_end;
    const newHtml = data.documents.map((p,i) => {
      const idx = startIdx + i;
      return `<div class="sr-item" style="display:flex;align-items:center;gap:8px">
        <div style="flex:1;cursor:pointer" onclick="pickSearch(${idx})">
          <div class="sr-name">${p.place_name}</div>
          <div class="sr-addr">${p.road_address_name || p.address_name}</div>
        </div>
        <input type="checkbox" class="sr-chk" data-idx="${idx}" style="width:18px;height:18px;flex-shrink:0;accent-color:var(--accent);cursor:pointer" onclick="event.stopPropagation();toggleSrChk(${idx},this)">
      </div>`;
    }).join('');
    // 더보기 버튼 제거 후 새 결과 추가
    const oldMore = box.querySelector('.sr-more');
    if (oldMore) oldMore.remove();
    if (append) box.insertAdjacentHTML('beforeend', newHtml);
    else box.innerHTML = newHtml;
    // 더보기 버튼
    if (!_searchEnd && _searchPage < 45) {
      box.insertAdjacentHTML('beforeend', `<div class="sr-more" style="text-align:center;padding:8px;cursor:pointer;color:var(--accent);font-size:13px;font-weight:500" onclick="loadMoreSearch()">더보기 ▼</div>`);
    }
  } catch(e) {
    if (!append) box.innerHTML = '<div class="search-loading" style="color:var(--red)">검색 실패. 잠시 후 다시 시도해주세요</div>';
  }
}

function loadMoreSearch() {
  _searchPage++;
  doSearch(true);
}

function toggleSrChk(i, el) {
  if (!window._srChecked) window._srChecked = new Set();
  if (el.checked) window._srChecked.add(i);
  else window._srChecked.delete(i);
  const bar = document.getElementById('srBatchBar');
  const cnt = document.getElementById('srBatchCount');
  if (bar) {
    bar.style.display = window._srChecked.size > 0 ? 'flex' : 'none';
    if (cnt) cnt.textContent = window._srChecked.size + '개 선택됨';
  }
}

function showBatchConfirm() {
  if (!window._srChecked || !window._srChecked.size) return;
  window._batchMode = true;
  const names = [];
  window._srChecked.forEach(i => { if(window._sd[i]) names.push(window._sd[i].place_name); });
  document.getElementById('scName').textContent = names.join(', ');
  document.getElementById('scAddr').textContent = names.length + '개 장소 일괄 추가';
  const sel = document.getElementById('scCat');
  sel.innerHTML = cats.map(c=>`<option value="${c.id}">${iconText(c.emoji)} ${c.name}</option>`).join('');
  document.getElementById('scMemo').value = '';
  document.getElementById('scConfirmBtn').textContent = names.length + '개 추가하기';
  document.getElementById('searchConfirm').style.display = 'block';
  document.getElementById('sr').style.display = 'none';
  document.getElementById('srBatchBar').style.display = 'none';
}

function batchAddConfirm() {
  if (!window._srChecked || !window._srChecked.size) return;
  const cat = document.getElementById('scCat').value;
  const memo = document.getElementById('scMemo').value.trim();
  let added = 0;
  const existSet = new Set(places.map(x => x.name + '||' + x.addr));
  window._srChecked.forEach(i => {
    const p = window._sd[i];
    if (!p) return;
    const name = p.place_name;
    const addr = p.road_address_name || p.address_name;
    const key = name + '||' + addr;
    if (existSet.has(key)) return;
    existSet.add(key);
    places.push({
      id: Date.now() + added * 100 + Math.floor(Math.random()*99),
      name, addr,
      lat: parseFloat(p.y), lng: parseFloat(p.x),
      cat, memo, visited: false
    });
    added++;
  });
  if (added) {
    saveData();
    toast(`${added}개 장소 추가됨`);
  }
  closeAddPanel();
  renderAll();
  showTab('list');
}

function pickSearch(i) {
  window._batchMode = false;
  window._selectedSearch = window._sd[i];
  const p = window._selectedSearch;
  document.getElementById('scName').textContent = p.place_name;
  document.getElementById('scAddr').textContent = p.road_address_name || p.address_name;
  const sel = document.getElementById('scCat');
  sel.innerHTML = cats.map(c=>`<option value="${c.id}">${iconText(c.emoji)} ${c.name}</option>`).join('');
  document.getElementById('scMemo').value = '';
  document.getElementById('scConfirmBtn').textContent = '추가하기';
  document.getElementById('searchConfirm').style.display = 'block';
  document.getElementById('sr').innerHTML = '';
  document.getElementById('srBatchBar').style.display = 'none';
}

function confirmSearch() {
  if (window._batchMode) { batchAddConfirm(); return; }
  const p = window._selectedSearch;
  if (!p) return;
  const cat = document.getElementById('scCat').value;
  const memo = document.getElementById('scMemo').value.trim();
  addPlace({
    id: Date.now(),
    name: p.place_name,
    addr: p.road_address_name || p.address_name,
    lat: parseFloat(p.y), lng: parseFloat(p.x),
    cat, memo, visited: false
  });
  closeAddPanel();
  renderAll();
  showTab('list');
}

function cancelSearch() {
  document.getElementById('searchConfirm').style.display = 'none';
  document.getElementById('sr').style.display = '';
  if (window._srChecked && window._srChecked.size) {
    document.getElementById('srBatchBar').style.display = 'flex';
  }
  window._selectedSearch = null;
  window._batchMode = false;
  document.getElementById('scConfirmBtn').textContent = '추가하기';
}

function addManual() {
  const name = document.getElementById('mName').value.trim();
  if (!name) { toast('장소 이름을 입력해주세요'); return; }
  const addr = document.getElementById('mAddr').value.trim();
  const cat = document.getElementById('mCat').value;
  const memo = document.getElementById('mMemo').value.trim();

  const finish = (lat, lng) => {
    addPlace({ id:Date.now(), name, addr, lat, lng, cat, memo, visited:false });
    document.getElementById('mName').value='';
    document.getElementById('mAddr').value='';
    document.getElementById('mMemo').value='';
    closeAddPanel();
    renderAll();
    showTab('list');
  };

  if (addr) {
    fetch(`https://dapi.kakao.com/v2/local/search/address.json?query=${encodeURIComponent(addr)}`, {
      headers: { 'Authorization': `KakaoAK ${REST_KEY}` }
    }).then(r=>r.json()).then(d=>{
      if (d.documents?.length) finish(parseFloat(d.documents[0].y), parseFloat(d.documents[0].x));
      else finish(37.5665, 126.9780);
    }).catch(()=>finish(37.5665, 126.9780));
  } else finish(37.5665, 126.9780);
}

function addPlace(p) {
  // 중복 체크 (이름 + 주소 동일하면 중복)
  const dup = places.find(x => x.name === p.name && x.addr === p.addr);
  if (dup) { toast('이미 등록된 장소예요'); return false; }
  places.push(p);
  saveData();
  // 추가된 장소로 지도 포커스
  if (map && p.lat && p.lng) {
    map.setCenter(new kakao.maps.LatLng(p.lat, p.lng));
    map.setLevel(4);
  }
  toast(`📍 ${p.name} 추가 완료!`);
  return true;
}

const SVG_KEYS = Object.keys(SVG_ICONS);

// SVG 크기 변환 유틸 (루트 SVG 태그의 width/height만 변경)
function svgSized(svgStr, size) {
  if (!svgStr) return '';
  let count = 0;
  const result = svgStr.replace(/width="\d+"/g, m => count++ < 1 ? `width="${size}"` : m);
  count = 0;
  return result.replace(/height="\d+"/g, m => count++ < 1 ? `height="${size}"` : m);
}

// 아이콘 키 → SVG HTML (키가 아닌 경우 그대로 반환 = 이모지 호환)
function getIcon(key, size) {
  if (SVG_ICONS[key]) return size ? svgSized(SVG_ICONS[key], size) : SVG_ICONS[key];
  return key || '';
}

// select 옵션용 텍스트 (SVG는 표시 불가 → 빈 문자열)
function iconText(key) {
  if (SVG_ICONS[key]) return '';
  return key || '';
}

let dragFromIdx = null;
let touchDragState = null; // 터치 드래그 전역 상태

function setupCatDrag() {
  const list = document.getElementById('catList');
  const rows = list.querySelectorAll('.cat-row');

  // ── Desktop: HTML5 drag ──
  rows.forEach(row => {
    row.addEventListener('dragstart', e => {
      dragFromIdx = parseInt(row.dataset.idx);
      row.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    row.addEventListener('dragend', () => {
      row.classList.remove('dragging');
      rows.forEach(r => r.classList.remove('drag-over'));
    });
    row.addEventListener('dragover', e => {
      e.preventDefault();
      rows.forEach(r => r.classList.remove('drag-over'));
      row.classList.add('drag-over');
    });
    row.addEventListener('drop', e => {
      e.preventDefault();
      const toIdx = parseInt(row.dataset.idx);
      if (dragFromIdx !== null && dragFromIdx !== toIdx) {
        const [moved] = cats.splice(dragFromIdx, 1);
        cats.splice(toIdx, 0, moved);
        renderCatEditor();
      }
      rows.forEach(r => r.classList.remove('drag-over'));
      dragFromIdx = null;
    });
  });

  // ── Mobile: Touch drag (연속 DOM 스왑) ──
  rows.forEach(row => {
    const handle = row.querySelector('.cat-handle');
    if (!handle) return;

    handle.addEventListener('touchstart', e => {
      e.preventDefault();
      const rect = row.getBoundingClientRect();
      touchDragState = {
        dragRow: row,
        startY: e.touches[0].clientY,
        offsetY: e.touches[0].clientY - rect.top,
        rowH: row.offsetHeight + 4
      };
      row.classList.add('touch-dragging');
    }, { passive: false });
  });

  // list 레벨 touchmove/end (한 번만 등록)
  if (!list._touchDragBound) {
    list._touchDragBound = true;

    list.addEventListener('touchmove', e => {
      if (!touchDragState) return;
      e.preventDefault();
      const { dragRow, rowH } = touchDragState;
      const curY = e.touches[0].clientY;
      const dy = curY - touchDragState.startY;
      dragRow.style.transform = `translateY(${dy}px) scale(1.04)`;

      // 아래 row와 스왑
      const allRows = [...list.querySelectorAll('.cat-row')];
      const curDomIdx = allRows.indexOf(dragRow);
      if (dy > rowH * 0.6 && curDomIdx < allRows.length - 1) {
        const next = allRows[curDomIdx + 1];
        list.insertBefore(next, dragRow);
        touchDragState.startY += rowH;
        next.style.transition = 'transform 0.15s';
        next.style.transform = 'translateY(-' + rowH + 'px)';
        requestAnimationFrame(() => { next.style.transform = ''; setTimeout(() => { next.style.transition = ''; }, 150); });
      }
      // 위 row와 스왑
      else if (dy < -rowH * 0.6 && curDomIdx > 0) {
        const prev = allRows[curDomIdx - 1];
        list.insertBefore(dragRow, prev);
        touchDragState.startY -= rowH;
        prev.style.transition = 'transform 0.15s';
        prev.style.transform = 'translateY(' + rowH + 'px)';
        requestAnimationFrame(() => { prev.style.transform = ''; setTimeout(() => { prev.style.transition = ''; }, 150); });
      }
    }, { passive: false });

    list.addEventListener('touchend', e => {
      if (!touchDragState) return;
      const { dragRow } = touchDragState;
      dragRow.classList.remove('touch-dragging');
      dragRow.style.transform = '';
      // DOM 순서에서 cats 배열 재구성
      const allRows = [...list.querySelectorAll('.cat-row')];
      const newCats = allRows.map(r => cats[parseInt(r.dataset.idx)]);
      cats.splice(0, cats.length, ...newCats);
      touchDragState = null;
      autosaveCats();
      renderCatEditor(); // data-idx 갱신
    });
  }
}

let nearbyMarkers = [];
let nearbyActiveCategory = null;
async function searchNearbyKeyword(keyword, label, btnEl, icon, catFilter) {
  const key = 'kw_' + keyword;
  if (nearbyActiveCategory === key) { clearNearbyMarkers(); return; }
  let lat, lng;
  if (myLat !== null) { lat = myLat; lng = myLng; }
  else { const c = map.getCenter(); lat = c.getLat(); lng = c.getLng(); }
  toast(`🔍 주변 ${label} 검색 중...`);
  try {
    // 여러 키워드는 각각 검색 후 합침
    const keywords = keyword.split(' OR ');
    let allDocs = [];
    for (const kw of keywords) {
      const res = await fetch(`https://dapi.kakao.com/v2/local/search/keyword.json?query=${encodeURIComponent(kw)}&x=${lng}&y=${lat}&radius=5000&sort=distance&size=10`, {
        headers: { 'Authorization': `KakaoAK ${REST_KEY}` }
      });
      const data = await res.json();
      if (data.documents) allDocs = allDocs.concat(data.documents);
    }
    // 중복 제거 (id 기준)
    const seen = new Set();
    allDocs = allDocs.filter(d => { if (seen.has(d.id)) return false; seen.add(d.id); return true; });
    // 카테고리 필터 (영화관 등 정확도 향상)
    if (catFilter) {
      const filters = catFilter.split(',');
      allDocs = allDocs.filter(d => filters.some(f => (d.category_name||'').includes(f) || (d.category_group_name||'').includes(f)));
    }
    // 거리순 정렬
    allDocs.sort((a, b) => (parseInt(a.distance)||0) - (parseInt(b.distance)||0));
    allDocs = allDocs.slice(0, 15);
    if (!allDocs.length) { toast(`주변에 ${label}이(가) 없어요`); return; }
    clearNearbyMarkers();
    nearbyActiveCategory = key;
    document.querySelectorAll('.nb-btn').forEach(b => b.classList.remove('active'));
    if (btnEl) btnEl.classList.add('active');
    renderNearbyResults(allDocs, icon);
    toast(`${label} ${allDocs.length}곳 발견`);
  } catch(e) { toast('검색 실패'); }
}

async function searchNearby(categoryCode, label, btnEl, icon) {
  // 토글: 같은 카테고리 다시 누르면 해제
  if (nearbyActiveCategory === categoryCode) {
    clearNearbyMarkers();
    return;
  }
  // 위치 기준 결정: 내 위치 > 지도 중심
  let lat, lng;
  if (myLat !== null) { lat = myLat; lng = myLng; }
  else { const c = map.getCenter(); lat = c.getLat(); lng = c.getLng(); }

  toast(`🔍 주변 ${label} 검색 중...`);
  try {
    const res = await fetch(`https://dapi.kakao.com/v2/local/search/category.json?category_group_code=${categoryCode}&x=${lng}&y=${lat}&radius=2000&sort=distance&size=15`, {
      headers: { 'Authorization': `KakaoAK ${REST_KEY}` }
    });
    const data = await res.json();
    if (!data.documents || !data.documents.length) { toast(`주변에 ${label}이(가) 없어요`); return; }

    clearNearbyMarkers();
    nearbyActiveCategory = categoryCode;
    document.querySelectorAll('.nb-btn').forEach(b => b.classList.remove('active'));
    if (btnEl) btnEl.classList.add('active');
    renderNearbyResults(data.documents, icon);
    toast(`${label} ${data.documents.length}곳 발견`);
  } catch(e) {
    toast('검색 실패');
  }
}

// ── 내 위치 ──
let locPressTimer = null;
let locWasLong = false;

function setupLocBtn() {
  const el = document.getElementById('locBtn');
  // mousedown/up 사용 (pointerdown이 lucide 재렌더 시 유실 가능)
  el.onmousedown = el.ontouchstart = function(e) {
    e.preventDefault();
    locWasLong = false;
    locPressTimer = setTimeout(() => { locWasLong = true; stopTracking(); }, 800);
  };
  el.onmouseup = el.ontouchend = function(e) {
    e.preventDefault();
    clearTimeout(locPressTimer);
    if (!locWasLong) handleLocClick();
  };
  el.onmouseleave = function() { clearTimeout(locPressTimer); };
}

function handleLocClick() {
  if (!navigator.geolocation) { toast('이 브라우저에서 위치를 지원하지 않아요'); return; }

  // Permissions API로 차단 상태 먼저 확인
  if (navigator.permissions) {
    navigator.permissions.query({ name: 'geolocation' }).then(result => {
      if (result.state === 'denied') {
        const isMobile = /iPhone|iPad|Android/i.test(navigator.userAgent);
        if (/iPhone|iPad/i.test(navigator.userAgent)) {
          toast('⚠️ 위치가 차단됨 → 설정 > Safari > 위치 서비스에서 허용해주세요');
        } else if (/Android/i.test(navigator.userAgent)) {
          toast('⚠️ 위치가 차단됨 → 브라우저 설정 > 사이트 설정 > 위치에서 허용해주세요');
        } else {
          toast('⚠️ 위치가 차단됨 → 주소창 왼쪽 자물쇠 아이콘 클릭 후 위치를 허용해주세요');
        }
        return;
      }
      _doLocClick();
    }).catch(() => _doLocClick());
  } else {
    _doLocClick();
  }
}

function _doLocClick() {
  // 이미 추적 중이면 → 내 위치로 센터링만
  if (watchId !== null) {
    if (myLat !== null) {
      map.setCenter(new kakao.maps.LatLng(myLat, myLng));
      map.setLevel(4);
      toast('📍 내 위치로 이동');
    }
    return;
  }

  // 추적 시작
  toast('📍 위치 확인 중...');
  document.getElementById('locBtn').classList.add('tracking');

  function onLocSuccess(pos) {
    const acc = pos.coords.accuracy; // 정확도 (미터)
    myLat = pos.coords.latitude;
    myLng = pos.coords.longitude;
    localStorage.setItem('datemap-lastloc', JSON.stringify({lat:myLat,lng:myLng}));
    updateMyLocMarker();
    map.setCenter(new kakao.maps.LatLng(myLat, myLng));
    map.setLevel(4);
    renderList();
    if (acc > 1000) {
      toast('📍 위치 정확도가 낮아요 (' + Math.round(acc/1000) + 'km). GPS를 켜주세요');
    } else {
      toast('📍 내 위치 표시 중 (길게 누르면 종료)');
    }

    watchId = navigator.geolocation.watchPosition(wp => {
      // 정확도가 너무 낮은 결과는 무시 (1km 이상)
      if (wp.coords.accuracy > 1000) return;
      myLat = wp.coords.latitude;
      myLng = wp.coords.longitude;
      updateMyLocMarker();
      renderList();
    }, err => {}, { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 });
  }
  const isMobile = /iPhone|iPad|Android/i.test(navigator.userAgent);
  function onLocError(err) {
    document.getElementById('locBtn').classList.remove('tracking');
    if (err.code === 1) {
      toast('위치 권한이 거부되었어요. 브라우저 설정에서 허용해주세요');
    } else if (err.code === 2) {
      // 높은 정확도 실패 시 낮은 정확도로 재시도 (PC/모바일 공통)
      navigator.geolocation.getCurrentPosition(onLocSuccess, err2 => {
        toast('위치를 가져올 수 없어요. 위치 서비스를 확인해주세요');
      }, { enableHighAccuracy: false, timeout: 15000 });
    } else {
      toast('위치 확인 시간 초과. 다시 시도해주세요');
    }
  }
  navigator.geolocation.getCurrentPosition(onLocSuccess, onLocError, { enableHighAccuracy: true, timeout: 15000 });
}

function stopTracking() {
  if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  document.getElementById('locBtn').classList.remove('tracking');
  if (myLocMarker) { myLocMarker.setMap(null); myLocMarker = null; }
  if (myLocOverlay) { myLocOverlay.setMap(null); myLocOverlay = null; }
  myLat = null; myLng = null;
  renderList();
  toast('위치 추적 종료');
}

function updateMyLocMarker() {
  if (!map || myLat === null) return;
  const pos = new kakao.maps.LatLng(myLat, myLng);
  if (!myLocOverlay) {
    const el = document.createElement('div');
    el.style.cssText = 'position:relative;width:56px;height:56px;pointer-events:none';
    el.innerHTML = '<div style="position:absolute;inset:0;background:rgba(66,133,244,.1);border-radius:50%;animation:locPulse 2s infinite"></div>' +
      '<div style="position:absolute;inset:8px;background:rgba(66,133,244,.15);border-radius:50%"></div>' +
      '<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:20px;height:20px;background:#4285F4;border:3px solid white;border-radius:50%;box-shadow:0 0 10px rgba(66,133,244,.8)"></div>';
    myLocOverlay = new kakao.maps.CustomOverlay({ position: pos, content: el, yAnchor: 0.5, xAnchor: 0.5, zIndex: 999 });
    myLocOverlay.setMap(map);
  } else {
    myLocOverlay.setPosition(pos);
  }
}

function getDistanceKm(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2-lat1)*Math.PI/180;
  const dLng = (lng2-lng1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function formatDist(km) {
  if (km < 1) return Math.round(km*1000) + 'm';
  return km.toFixed(1) + 'km';
}
function formatWalkTime(km) {
  const min = Math.round(km * 1000 / 80); // 분속 80m
  if (min < 1) return '1분 미만';
  if (min < 60) return '도보 ' + min + '분';
  const h = Math.floor(min / 60);
  const m = min % 60;
  return '도보 ' + h + '시간' + (m ? ' ' + m + '분' : '');
}
function formatCarTime(km) {
  const min = Math.round(km / 0.5); // 평균 시속 30km (시내)
  if (min < 1) return '1분 미만';
  if (min < 60) return '차량 ' + min + '분';
  const h = Math.floor(min / 60);
  const m = min % 60;
  return '차량 ' + h + '시간' + (m ? ' ' + m + '분' : '');
}

// ── 닉네임 ──
function saveNick() {
  const v = document.getElementById('nickInput').value.trim();
  if (!v) { toast('닉네임을 입력해주세요'); return; }
  myNick = v;
  localStorage.setItem('datemap-nick', myNick);
  document.getElementById('nickModal').classList.remove('open');
  renderAll();
}

function checkNick() {
  if (!myNick) document.getElementById('nickModal').classList.add('open');
}

function changeNick() {
  const v = document.getElementById('nickChange').value.trim();
  if (!v) { toast('닉네임을 입력해주세요'); return; }
  const oldNick = myNick;
  myNick = v;
  localStorage.setItem('datemap-nick', myNick);
  // 기존 별점의 닉네임도 변경
  places.forEach(p => {
    if (p.ratings && p.ratings[oldNick] !== undefined) {
      p.ratings[myNick] = p.ratings[oldNick];
      delete p.ratings[oldNick];
    }
  });
  saveData();
  const newNick = myNick;
  toast('닉네임이 "' + newNick + '"(으)로 변경됐어요');
  renderAll();
  // renderAll 이후 DOM 재설정
  setTimeout(() => {
    const ni = document.getElementById('nickChange');
    if (ni) ni.value = newNick;
    const cn = document.getElementById('currentNick');
    if (cn) cn.textContent = newNick;
  }, 50);
}

// ── 별점 ──
const starSvg = '<svg viewBox="0 0 24 24" stroke-width="1.5"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.27 5.82 21 7 14.14l-5-4.87 6.91-1.01L12 2z"/></svg>';
function renderStars(placeId, nick, score) {
  let html = '';
  for (let i = 1; i <= 5; i++) {
    html += `<span class="star ${i<=score?'on':'off'}" onclick="event.stopPropagation();setRating(${placeId},'${nick}',${i})">${starSvg}</span>`;
  }
  return html;
}

function setRating(placeId, nick, score) {
  if (nick !== myNick) { toast('본인 별점만 수정할 수 있어요'); return; }
  const p = places.find(x => x.id === placeId);
  if (!p) return;
  if (!p.ratings) p.ratings = {};
  p.ratings[nick] = score;
  saveData(); renderAll();
}

function getAvgRating(p) {
  if (!p.ratings) return null;
  const vals = Object.values(p.ratings);
  if (!vals.length) return null;
  return (vals.reduce((a,b) => a+b, 0) / vals.length).toFixed(1);
}

function renderRatingBlock(p) {
  if (!p.ratings) p.ratings = {};
  const nicks = [...Object.keys(p.ratings)];
  if (myNick && !nicks.includes(myNick)) nicks.push(myNick);
  const avg = getAvgRating(p);
  let html = '<div class="pi-rating">';
  if (avg) html += `<div class="pi-rating-avg" style="display:flex;align-items:center;gap:3px"><svg width="14" height="14" viewBox="0 0 24 24" fill="#F1C40F" stroke="#E6B800" stroke-width="1.5"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.27 5.82 21 7 14.14l-5-4.87 6.91-1.01L12 2z"/></svg> ${avg}</div>`;
  nicks.forEach(nick => {
    const score = p.ratings[nick] || 0;
    const isMe = nick === myNick;
    html += `<div class="pi-rating-row">
      <span class="pi-rating-name">${nick}</span>
      ${isMe ? renderStars(p.id, nick, score) : renderStarsReadonly(score)}
    </div>`;
  });
  html += '</div>';
  return html;
}

function renderStarsReadonly(score) {
  let html = '';
  for (let i = 1; i <= 5; i++) {
    html += `<span class="star ${i<=score?'on':'off'}" style="cursor:default">${starSvg}</span>`;
  }
  return html;
}

let _toastTimer = null;
function toast(msg) {
  const el=document.getElementById('toast');
  if (_toastTimer) clearTimeout(_toastTimer);
  el.classList.remove('show');
  // 강제 리플로우 후 다시 표시 (연속 호출 시에도 확실히 보이게)
  void el.offsetWidth;
  el.textContent=msg; el.classList.add('show');
  _toastTimer = setTimeout(()=>{ el.classList.remove('show'); _toastTimer=null; },2500);
}

// ── 버전 체크 ──
const APP_VERSION = 83;
function checkVersion() {
  fetch('version.json?t=' + Date.now()).then(r => r.json()).then(d => {
    if (d.v && d.v > APP_VERSION) {
      doForceReload();
    }
  }).catch(() => {});
}
function forceUpdate() {
  toast('🔄 업데이트 확인 중...');
  fetch('version.json?t=' + Date.now()).then(r => r.json()).then(d => {
    if (d.v && d.v > APP_VERSION) {
      toast('🔄 새 버전 발견! 업데이트 중...');
      doForceReload();
    } else {
      toast('🤖 최신 버전이에요 (v' + APP_VERSION + ')');
    }
  }).catch(() => {
    // version.json 못 가져와도 강제 새로고침 시도
    toast('🔄 강제 새로고침 중...');
    doForceReload();
  });
}
function doForceReload() {
  if ('caches' in window) {
    caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k)))).then(() => {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(regs => {
          Promise.all(regs.map(r => r.unregister())).then(() => window.location.reload(true));
        });
      } else {
        window.location.reload(true);
      }
    });
  } else {
    window.location.reload(true);
  }
}

// ── 시작 ──
window.addEventListener('load', () => {
  checkVersion();
  loadData();
  checkNick();
  startRealtimeSync();
  setupLocBtn();
  // 카카오 지도 SDK 동적 로드
  const script = document.createElement('script');
  script.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=fc85da8522a1e81f1e19c6777c002a55&autoload=false';
  script.onload = () => kakao.maps.load(initMap);
  document.head.appendChild(script);
  renderAll();
  lucide.createIcons();

  // Service Worker 등록
  if ('serviceWorker' in navigator) {
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!refreshing) { refreshing = true; window.location.reload(); }
    });
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.update();
      reg.onupdatefound = () => {
        const sw = reg.installing;
        sw.onstatechange = () => {
          if (sw.state === 'installed' && navigator.serviceWorker.controller) {
            sw.postMessage({ type: 'SKIP_WAITING' });
          }
        };
      };
    });
  }
});
