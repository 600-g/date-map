<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리 데이트 맵</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@300;400;500&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--cream:#F5F0E8;--warm:#E8DDD0;--brown:#8B6F5E;--dark:#2C1810;--green:#4A7C59;--red:#C0392B}
body{font-family:'Noto Sans KR',sans-serif;background:var(--cream);color:var(--dark);height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{background:var(--dark);color:var(--cream);padding:11px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
header h1{font-family:'Noto Serif KR',serif;font-size:15px;font-weight:600}
.badge{font-size:11px;background:var(--green);color:white;padding:3px 10px;border-radius:20px;display:flex;align-items:center;gap:5px}
.dot{width:6px;height:6px;background:#7FD49A;border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.main{display:flex;flex:1;overflow:hidden}
.panel{width:320px;background:white;border-right:1px solid var(--warm);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
#map{flex:1;background:#e8e0d8}
.tabs{display:flex;border-bottom:1px solid var(--warm);flex-shrink:0}
.tab{flex:1;padding:10px 2px;text-align:center;font-size:11px;font-weight:500;color:var(--brown);cursor:pointer;border:none;border-bottom:2px solid transparent;background:none;transition:all .2s}
.tab.active{color:var(--dark);border-bottom-color:var(--dark)}
.tab-content{display:none;flex:1;overflow:hidden;flex-direction:column}
.tab-content.active{display:flex}
/* 공통 인풋 */
input,select,textarea{font-family:'Noto Sans KR',sans-serif;font-size:13px;border:1px solid var(--warm);border-radius:6px;padding:7px 10px;background:white;color:var(--dark);outline:none;transition:border-color .2s;width:100%;margin-bottom:6px}
input:focus,select:focus,textarea:focus{border-color:var(--brown)}
.lbl{font-size:11px;font-weight:600;color:var(--dark);margin-bottom:4px;margin-top:10px}
.lbl:first-child{margin-top:0}
.row{display:flex;gap:6px}
.row input,.row select{margin-bottom:0}
.btn{font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:500;padding:8px 14px;border-radius:6px;border:none;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-dark{background:var(--dark);color:white}
.btn-dark:hover{background:#4a2c1c}
.btn-outline{background:white;border:1px solid #ddd;color:var(--brown)}
.btn-sm{font-size:11px;padding:4px 10px}
/* 검색 */
.add-wrap{padding:12px;overflow-y:auto;flex:1}
.sr-item{padding:8px 10px;border:1px solid var(--warm);border-radius:6px;margin-bottom:5px;cursor:pointer;font-size:12px;transition:all .15s}
.sr-item:hover{border-color:var(--brown);background:var(--cream)}
.sr-name{font-weight:500;margin-bottom:2px}
.sr-addr{color:var(--brown);font-size:11px}
.search-loading{font-size:12px;color:var(--brown);padding:6px;text-align:center}
/* 목록 */
.filter-bar{display:flex;gap:4px;padding:8px 8px 4px;flex-wrap:wrap;flex-shrink:0}
.fb{font-size:11px;padding:4px 9px;border-radius:20px;border:1px solid var(--warm);background:white;color:var(--brown);cursor:pointer;transition:all .15s}
.fb.active{background:var(--dark);color:white;border-color:var(--dark)}
.place-list{flex:1;overflow-y:auto;padding:8px}
.pi{background:white;border:1px solid var(--warm);border-radius:8px;padding:10px 12px;margin-bottom:6px;cursor:pointer;transition:all .15s}
.pi:hover{border-color:var(--brown);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.pi.sel{border-color:var(--dark);background:var(--cream)}
.pi-top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.pi-name{font-size:13px;font-weight:500;flex:1}
.pi-cat{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:500;flex-shrink:0;cursor:pointer}
.pi-addr{font-size:11px;color:var(--brown);margin-top:3px}
.pi-memo{font-size:11px;color:#999;margin-top:3px;font-style:italic}
.addr-search{color:var(--brown);font-size:9px;font-weight:500;cursor:pointer;margin-left:4px;background:var(--cream);border:1px solid var(--warm);border-radius:4px;padding:1px 6px;display:inline-block;vertical-align:middle}
.addr-search:hover{background:var(--warm);color:var(--dark)}
.pi-acts{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap}
.bx{font-size:11px;padding:3px 9px;border-radius:4px;border:1px solid #ddd;background:white;cursor:pointer;color:#888;transition:all .15s;font-family:'Noto Sans KR',sans-serif}
.bx:hover{border-color:var(--brown);color:var(--brown)}
.bx.vis{background:var(--green);color:white;border-color:var(--green)}
.bx.del:hover{border-color:var(--red);color:var(--red)}
/* 별점 */
.pi-rating{margin-top:6px;font-size:11px;color:var(--brown)}
.pi-rating-avg{font-weight:600;color:var(--dark);font-size:12px;margin-bottom:2px}
.pi-rating-row{display:flex;align-items:center;gap:4px;margin-bottom:2px}
.pi-rating-name{font-size:10px;color:var(--brown);min-width:36px}
.star{cursor:pointer;font-size:14px;transition:transform .1s}
.star:hover{transform:scale(1.3)}
.star.on{color:#F1C40F}
.star.off{color:#ddd}
/* 설정/공유 */
.cfg-wrap{padding:14px;overflow-y:auto;flex:1}
.s-title{font-size:13px;font-weight:600;margin-bottom:4px}
.s-desc{font-size:11px;color:var(--brown);margin-bottom:8px;line-height:1.5}
.code-box{background:var(--cream);border:1px solid var(--warm);border-radius:6px;padding:10px;font-size:10px;font-family:monospace;word-break:break-all;max-height:56px;overflow-y:auto;margin-bottom:6px;color:var(--dark)}
hr.div{border:none;border-top:1px solid var(--warm);margin:14px 0}
/* 카테고리 편집 */
.cat-list{margin-bottom:8px}
.cat-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;background:var(--cream);border-radius:6px;padding:6px 8px}
.cat-emoji{font-size:16px;cursor:pointer;min-width:24px;text-align:center}
.cat-name-input{flex:1;margin-bottom:0;font-size:12px;padding:4px 8px}
.cat-color{width:28px;height:28px;border-radius:4px;border:1px solid var(--warm);cursor:pointer;flex-shrink:0;padding:0}
.cat-del{background:none;border:none;cursor:pointer;color:#ccc;font-size:14px;padding:2px 4px;flex-shrink:0}
.cat-del:hover{color:var(--red)}
.cat-summary-item{display:inline-block;font-size:11px;padding:3px 8px;border-radius:12px;margin:2px;border:1px solid var(--warm)}
.save-success{background:var(--green) !important;border-color:var(--green) !important}
/* 모달 - 카테고리 변경 */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:white;border-radius:12px;padding:16px;width:260px;max-height:80vh;overflow-y:auto}
.modal h3{font-size:14px;font-weight:600;margin-bottom:12px}
.modal-cat-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;cursor:pointer;transition:background .15s}
.modal-cat-item:hover{background:var(--cream)}
.modal-cat-dot{width:10px;height:10px;border-radius:50%}
.modal-cat-name{font-size:13px}
.modal-close{margin-top:10px;width:100%;padding:8px;border:1px solid var(--warm);border-radius:6px;background:white;cursor:pointer;font-size:12px;color:var(--brown)}
/* 빈 상태 */
.empty{text-align:center;padding:40px 16px;color:var(--brown)}
.empty .ico{font-size:36px;margin-bottom:10px}
.empty p{font-size:12px;line-height:1.7}
/* 내 위치 버튼 */
.my-loc-btn{position:absolute;bottom:20px;right:12px;z-index:10;width:40px;height:40px;border-radius:50%;background:white;border:1px solid var(--warm);box-shadow:0 2px 8px rgba(0,0,0,.15);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.my-loc-btn:hover{background:var(--cream);box-shadow:0 2px 12px rgba(0,0,0,.2)}
.my-loc-btn.tracking{background:#4285F4;color:white;border-color:#4285F4;box-shadow:0 0 12px rgba(66,133,244,.4)}
.pi-dist{font-size:10px;color:var(--green);margin-top:2px;font-weight:500}
/* lucide 아이콘 */
.lc{display:inline-flex;align-items:center;vertical-align:middle}
.lc svg{width:14px;height:14px;stroke-width:2}
.lc-sm svg{width:12px;height:12px}
.lc-lg svg{width:18px;height:18px}
header .lc svg{width:16px;height:16px}
.tab .lc svg{width:13px;height:13px}
.my-loc-btn .lc svg{width:20px;height:20px}
.empty .lc svg{width:36px;height:36px;stroke-width:1.5}
/* 토스트 */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--dark);color:white;padding:10px 20px;border-radius:20px;font-size:13px;transition:transform .3s;z-index:9999}
.toast.show{transform:translateX(-50%) translateY(0)}
@media(max-width:680px){
  .main{flex-direction:column}
  .panel{width:100%;height:48vh;border-right:none;border-bottom:1px solid var(--warm)}
  #map{height:52vh}
}
</style>
<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js"></script>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>
<header>
  <h1><i data-lucide="map-pinned" class="lc"></i> 우리 데이트 맵</h1>
  <div class="badge"><div class="dot"></div><span id="cnt">0</span>개 장소</div>
</header>
<div class="main">
  <div class="panel">
    <div class="tabs">
      <button class="tab active" onclick="showTab('list')"><i data-lucide="list" class="lc lc-sm"></i> 목록</button>
      <button class="tab" onclick="showTab('add')"><i data-lucide="plus-circle" class="lc lc-sm"></i> 추가</button>
      <button class="tab" onclick="showTab('cfg')"><i data-lucide="settings" class="lc lc-sm"></i> 설정</button>
    </div>

    <!-- 목록 탭 -->
    <div id="tab-list" class="tab-content active">
      <div class="filter-bar" id="filterBar">
        <button class="fb active" onclick="setFilter(this,'전체')">전체</button>
      </div>
      <div class="place-list" id="placeList">
        <div class="empty"><div class="ico"><i data-lucide="map-pin" class="lc"></i></div><p>아직 장소가 없어요<br>추가 탭에서 더해보세요</p></div>
      </div>
    </div>

    <!-- 추가 탭 -->
    <div id="tab-add" class="tab-content">
      <div class="add-wrap">
        <div class="lbl"><i data-lucide="search" class="lc lc-sm"></i> 카카오 장소 검색</div>
        <div class="row" style="margin-bottom:6px">
          <input id="sq" type="text" placeholder="예: 안국 한옥카페" onkeydown="if(event.key==='Enter')doSearch()">
          <button class="btn btn-dark btn-sm" style="flex-shrink:0;margin-bottom:0" onclick="doSearch()">검색</button>
        </div>
        <div id="sr"></div>

        <!-- 검색 결과 선택 후 카테고리/메모 입력 -->
        <div id="searchConfirm" style="display:none;background:var(--cream);border:1px solid var(--warm);border-radius:8px;padding:12px;margin-top:6px">
          <div style="font-size:13px;font-weight:500;margin-bottom:2px" id="scName"></div>
          <div style="font-size:11px;color:var(--brown);margin-bottom:8px" id="scAddr"></div>
          <div class="lbl" style="margin-top:0">카테고리</div>
          <select id="scCat" style="margin-bottom:6px"></select>
          <div class="lbl" style="margin-top:0">메모</div>
          <textarea id="scMemo" rows="2" placeholder="영업시간, 예약여부 등" style="resize:none"></textarea>
          <div class="row" style="margin-top:6px">
            <button class="btn btn-outline" style="flex:1" onclick="cancelSearch()">취소</button>
            <button class="btn btn-dark" style="flex:1" onclick="confirmSearch()">추가하기</button>
          </div>
        </div>

        <hr class="div" style="margin:10px 0">
        <div class="lbl"><i data-lucide="pencil" class="lc lc-sm"></i> 직접 입력</div>
        <input id="mName" type="text" placeholder="장소 이름 *">
        <input id="mAddr" type="text" placeholder="주소 (선택 — 지도 핀 위치용)">
        <div class="lbl" style="margin-top:0">카테고리</div>
        <select id="mCat" style="margin-bottom:6px"></select>
        <div class="lbl" style="margin-top:0">메모</div>
        <textarea id="mMemo" rows="2" placeholder="영업시간, 예약여부 등" style="resize:none"></textarea>
        <button class="btn btn-dark" style="width:100%" onclick="addManual()">추가하기</button>
      </div>
    </div>

    <!-- 설정/공유 탭 -->
    <div id="tab-cfg" class="tab-content">
      <div class="cfg-wrap">

        <!-- 카테고리 관리 -->
        <div class="s-title" onclick="toggleCatEditor()" style="cursor:pointer;display:flex;align-items:center;justify-content:space-between">
          <span><i data-lucide="tags" class="lc lc-sm"></i> 카테고리 관리</span>
          <i data-lucide="chevron-down" class="lc lc-sm" id="catChevron" style="transition:transform .2s"></i>
        </div>
        <div class="s-desc">목록을 눌러 편집</div>
        <div id="catEditorWrap" style="display:none">
          <div class="cat-list" id="catList"></div>
          <button class="btn btn-outline btn-sm" style="width:100%;margin-bottom:4px" onclick="addCat()">+ 카테고리 추가</button>
          <button class="btn btn-dark btn-sm" style="width:100%;margin-bottom:0" id="saveCatBtn" onclick="saveCats()">카테고리 저장</button>
        </div>
        <!-- 카테고리 현재 목록 (닫혔을 때 표시) -->
        <div id="catSummary" style="margin-top:6px"></div>

        <hr class="div">
        <div class="s-title"><i data-lucide="user" class="lc lc-sm"></i> 내 닉네임</div>
        <div class="s-desc">별점에 표시되는 이름</div>
        <div class="row" style="margin-bottom:6px">
          <input id="nickChange" type="text" style="margin-bottom:0">
          <button class="btn btn-dark btn-sm" style="flex-shrink:0;margin-bottom:0" onclick="changeNick()">변경</button>
        </div>

        <hr class="div">
        <div class="s-title"><i data-lucide="trash-2" class="lc lc-sm"></i> 초기화</div>
        <div class="s-desc">모든 장소를 삭제합니다</div>
        <button class="btn btn-outline" style="width:100%" onclick="clearAll()">전체 초기화</button>
      </div>
    </div>
  </div>

  <div style="position:relative;flex:1;display:flex">
    <div id="map" style="flex:1"></div>
    <button class="my-loc-btn" id="locBtn" title="클릭: 내 위치 / 길게 누르기: 종료"><i data-lucide="locate" class="lc lc-lg"></i></button>
  </div>
</div>

<!-- 카테고리 변경 모달 -->
<div class="modal-overlay" id="catModal">
  <div class="modal">
    <h3>카테고리 변경</h3>
    <div id="modalCatList"></div>
    <button class="modal-close" onclick="closeModal()">닫기</button>
  </div>
</div>

<!-- 초기화 확인 모달 -->
<div class="modal-overlay" id="clearModal">
  <div class="modal" style="text-align:center">
    <div style="margin-bottom:10px"><i data-lucide="alert-triangle" class="lc" style="color:var(--red)"></i></div>
    <h3 style="margin-bottom:8px">정말 초기화할까요?</h3>
    <p style="font-size:12px;color:var(--brown);margin-bottom:16px;line-height:1.6">저장된 장소가 모두 삭제돼요<br>이 작업은 되돌릴 수 없어요</p>
    <div style="display:flex;gap:8px">
      <button class="btn btn-outline" style="flex:1" onclick="document.getElementById('clearModal').classList.remove('open')">취소</button>
      <button class="btn btn-dark" style="flex:1;background:var(--red)" onclick="confirmClear()">삭제하기</button>
    </div>
  </div>
</div>

<!-- 장소 삭제 확인 모달 -->
<div class="modal-overlay" id="delModal">
  <div class="modal" style="text-align:center">
    <div style="margin-bottom:10px"><i data-lucide="trash-2" class="lc lc-lg" style="color:var(--red)"></i></div>
    <h3 style="margin-bottom:8px"><span id="delPlaceName"></span></h3>
    <p style="font-size:12px;color:var(--brown);margin-bottom:16px;line-height:1.6">이 장소를 삭제할까요?</p>
    <div style="display:flex;gap:8px">
      <button class="btn btn-outline" style="flex:1" onclick="document.getElementById('delModal').classList.remove('open')">취소</button>
      <button class="btn btn-dark" style="flex:1;background:var(--red)" onclick="confirmDelPlace()">삭제</button>
    </div>
  </div>
</div>

<!-- 닉네임 설정 모달 -->
<div class="modal-overlay" id="nickModal">
  <div class="modal" style="text-align:center">
    <div style="margin-bottom:10px"><i data-lucide="smile" class="lc lc-lg" style="color:var(--green)"></i></div>
    <h3 style="margin-bottom:8px">닉네임을 알려주세요</h3>
    <p style="font-size:12px;color:var(--brown);margin-bottom:12px;line-height:1.6">별점에 이름이 표시돼요</p>
    <input id="nickInput" type="text" placeholder="예: 개떡, 찰떡" style="text-align:center;margin-bottom:10px">
    <button class="btn btn-dark" style="width:100%" onclick="saveNick()">시작하기</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Firebase 초기화 ──
firebase.initializeApp({
  apiKey: "AIzaSyAF6096bC-Q04qWXh5MjVsuJGhYBy76agM",
  authDomain: "datemap-759bf.firebaseapp.com",
  projectId: "datemap-759bf",
  storageBucket: "datemap-759bf.firebasestorage.app",
  messagingSenderId: "833273999923",
  appId: "1:833273999923:web:2696d0363c223c6bbbe946"
});
const db = firebase.firestore();
const docRef = db.collection('datemap').doc('shared');

// ── 기본 카테고리 ──
const DEFAULT_CATS = [
  { id:'식사', name:'식사', emoji:'🍽', bg:'#FDEBD0', color:'#C0392B' },
  { id:'카페', name:'카페', emoji:'☕', bg:'#D5E8D4', color:'#27AE60' },
  { id:'산책', name:'산책', emoji:'🌿', bg:'#D6EAF8', color:'#2980B9' },
  { id:'활동', name:'활동', emoji:'🎯', bg:'#E8DAEF', color:'#8E44AD' },
  { id:'기타', name:'기타', emoji:'📌', bg:'#F2F3F4', color:'#7F8C8D' },
];

let places = [], cats = [...DEFAULT_CATS];
let markers = [], iws = [], map, curFilter = '전체';
let editingPlaceId = null;
let myNick = localStorage.getItem('datemap-nick') || '';
let myLocMarker = null, myLocOverlay = null, watchId = null, myLat = null, myLng = null;
let firestoreReady = false;

const REST_KEY = 'f05925b16ad652c4bb02b5aac5e56b06';

// ── 스토리지 (Firestore + localStorage 백업) ──
function loadData() {
  // localStorage에서 먼저 로드 (오프라인/빠른 로딩용)
  try {
    const r1 = localStorage.getItem('datemap-v2');
    if (r1) places = JSON.parse(r1);
    const r2 = localStorage.getItem('datemap-cats');
    if (r2) cats = JSON.parse(r2);
  } catch(e) { places = []; cats = [...DEFAULT_CATS]; }
}

function saveData() {
  // localStorage 백업
  try { localStorage.setItem('datemap-v2', JSON.stringify(places)); } catch(e) {}
  // Firestore에 저장
  syncToFirestore();
}
function saveCatsData() {
  try { localStorage.setItem('datemap-cats', JSON.stringify(cats)); } catch(e) {}
  syncToFirestore();
}

function syncToFirestore() {
  docRef.set({ places: JSON.stringify(places), cats: JSON.stringify(cats) })
    .catch(e => console.log('Firestore 저장 실패:', e));
}

function startRealtimeSync() {
  docRef.onSnapshot(snap => {
    if (!snap.exists) return;
    const data = snap.data();
    try {
      const newPlaces = JSON.parse(data.places || '[]');
      const newCats = JSON.parse(data.cats || '[]');
      // 변경이 있을 때만 업데이트
      if (JSON.stringify(newPlaces) !== JSON.stringify(places) ||
          JSON.stringify(newCats) !== JSON.stringify(cats)) {
        places = newPlaces;
        cats = newCats.length ? newCats : [...DEFAULT_CATS];
        // localStorage 백업
        try { localStorage.setItem('datemap-v2', JSON.stringify(places)); } catch(e) {}
        try { localStorage.setItem('datemap-cats', JSON.stringify(cats)); } catch(e) {}
        renderAll();
      }
    } catch(e) {}
    firestoreReady = true;
  }, err => {
    console.log('Firestore 실시간 동기화 실패:', err);
  });
}

// ── 카카오 REST API 검색 (CORS 우회용 프록시 없이 직접) ──
async function doSearch() {
  const q = document.getElementById('sq').value.trim();
  if (!q) return;
  const box = document.getElementById('sr');
  box.innerHTML = '<div class="search-loading">🔍 검색 중...</div>';
  try {
    const res = await fetch(`https://dapi.kakao.com/v2/local/search/keyword.json?query=${encodeURIComponent(q)}&size=5`, {
      headers: { 'Authorization': `KakaoAK ${REST_KEY}` }
    });
    const data = await res.json();
    if (!data.documents || !data.documents.length) {
      box.innerHTML = '<div class="search-loading">결과가 없어요</div>'; return;
    }
    window._sd = data.documents;
    box.innerHTML = data.documents.map((p,i)=>
      `<div class="sr-item" onclick="pickSearch(${i})">
        <div class="sr-name">${p.place_name}</div>
        <div class="sr-addr">${p.road_address_name || p.address_name}</div>
      </div>`
    ).join('');
  } catch(e) {
    box.innerHTML = '<div class="search-loading" style="color:var(--red)">검색 실패. 잠시 후 다시 시도해주세요</div>';
  }
}

function pickSearch(i) {
  window._selectedSearch = window._sd[i];
  const p = window._selectedSearch;
  document.getElementById('scName').textContent = p.place_name;
  document.getElementById('scAddr').textContent = p.road_address_name || p.address_name;
  const sel = document.getElementById('scCat');
  sel.innerHTML = cats.map(c=>`<option value="${c.id}">${c.emoji} ${c.name}</option>`).join('');
  document.getElementById('scMemo').value = '';
  document.getElementById('searchConfirm').style.display = 'block';
  document.getElementById('sr').innerHTML = '';
}

function confirmSearch() {
  const p = window._selectedSearch;
  if (!p) return;
  const cat = document.getElementById('scCat').value;
  const memo = document.getElementById('scMemo').value.trim();
  addPlace({
    id: Date.now(),
    name: p.place_name,
    addr: p.road_address_name || p.address_name,
    lat: parseFloat(p.y), lng: parseFloat(p.x),
    cat, memo, visited: false
  });
  document.getElementById('searchConfirm').style.display = 'none';
  document.getElementById('sq').value = '';
  window._selectedSearch = null;
  showTab('list');
}

function cancelSearch() {
  document.getElementById('searchConfirm').style.display = 'none';
  window._selectedSearch = null;
}

// ── 직접 추가 ──
function addManual() {
  const name = document.getElementById('mName').value.trim();
  if (!name) { toast('장소 이름을 입력해주세요'); return; }
  const addr = document.getElementById('mAddr').value.trim();
  const cat = document.getElementById('mCat').value;
  const memo = document.getElementById('mMemo').value.trim();

  const finish = (lat, lng) => {
    addPlace({ id:Date.now(), name, addr, lat, lng, cat, memo, visited:false });
    document.getElementById('mName').value='';
    document.getElementById('mAddr').value='';
    document.getElementById('mMemo').value='';
    showTab('list');
  };

  if (addr) {
    fetch(`https://dapi.kakao.com/v2/local/search/address.json?query=${encodeURIComponent(addr)}`, {
      headers: { 'Authorization': `KakaoAK ${REST_KEY}` }
    }).then(r=>r.json()).then(d=>{
      if (d.documents?.length) finish(parseFloat(d.documents[0].y), parseFloat(d.documents[0].x));
      else finish(37.5665, 126.9780);
    }).catch(()=>finish(37.5665, 126.9780));
  } else finish(37.5665, 126.9780);
}

function addPlace(p) {
  // 중복 체크 (이름 + 주소 동일하면 중복)
  const dup = places.find(x => x.name === p.name && x.addr === p.addr);
  if (dup) { toast('이미 등록된 장소예요'); return; }
  places.push(p);
  saveData(); renderAll();
  toast(`📍 ${p.name} 추가됨`);
}

function renderMarkers() {
  if (!map) return;
  markers.forEach(m=>m.setMap(null)); iws.forEach(w=>w.close());
  markers=[]; iws=[];
  places.forEach((p)=>{
    const pos = new kakao.maps.LatLng(p.lat, p.lng);
    const c = getCat(p.cat);
    const marker = new kakao.maps.Marker({ position:pos, map });
    const iw = new kakao.maps.InfoWindow({
      content:`<div style="padding:8px 12px;font-size:12px;font-family:'Noto Sans KR';min-width:110px">
        <b>${p.name}</b>
        <div style="color:${c.color};font-size:11px;margin-top:2px">${c.emoji} ${c.name}${p.visited?' · ✅':''}</div>
      </div>`
    });
    kakao.maps.event.addListener(marker,'click',()=>{
      iws.forEach(w=>w.close()); iw.open(map,marker);
      document.querySelectorAll('.pi').forEach(el=>el.classList.remove('sel'));
      const el=document.getElementById('pi-'+p.id);
      if(el){el.classList.add('sel');el.scrollIntoView({behavior:'smooth',block:'nearest'});}
    });
    markers.push(marker); iws.push(iw);
  });
  // 위치 추적 중이 아닐 때만 전체 장소로 뷰 맞춤

    const b = new kakao.maps.LatLngBounds();
    places.forEach(p=>b.extend(new kakao.maps.LatLng(p.lat,p.lng)));
    map.setBounds(b);
  }
}

function updateExport() {

    ? btoa(encodeURIComponent(JSON.stringify(payload)))
    : '장소를 추가하면 코드가 생성돼요';
}
function copyCode() {
  if (!places.length) { toast('장소가 없어요'); return; }
  const payload = { places, cats };
  navigator.clipboard.writeText(btoa(encodeURIComponent(JSON.stringify(payload))))
    .then(()=>toast('✅ 코드 복사! 카톡으로 보내세요'));

function importCode() {
  const code = document.getElementById('importTxt').value.trim();
  if (!code) { toast('코드를 붙여넣어주세요'); return; }
  try {
    const parsed = JSON.parse(decodeURIComponent(atob(code)));
    // 구버전 호환 (places 배열만 있는 경우)
    const importedPlaces = Array.isArray(parsed) ? parsed : parsed.places || [];
    const importedCats = Array.isArray(parsed) ? null : parsed.cats;
    const ids = new Set(places.map(p=>p.id));
    let added=0;
    importedPlaces.forEach(p=>{ if(!ids.has(p.id)){places.push(p);added++;} });
    // 새 카테고리 merge
    if (importedCats) {
      const catIds = new Set(cats.map(c=>c.id));
      importedCats.forEach(c=>{ if(!catIds.has(c.id)) cats.push(c); });
    }
    saveData(); saveCatsData(); renderAll();
    document.getElementById('importTxt').value='';
    toast(`✅ ${added}개 장소 불러옴`);
  } catch(e) { toast('코드가 올바르지 않아요'); }
}

  toast('초기화됐어요');
}

// ── 내 위치 ──
let locPressTimer = null;
let locWasLong = false;

function setupLocBtn() {
  const el = document.getElementById('locBtn');
  // mousedown/up 사용 (pointerdown이 lucide 재렌더 시 유실 가능)
  el.onmousedown = el.ontouchstart = function(e) {
    e.preventDefault();
    locWasLong = false;
    locPressTimer = setTimeout(() => { locWasLong = true; stopTracking(); }, 800);
  };
  el.onmouseup = el.ontouchend = function(e) {
    e.preventDefault();
    clearTimeout(locPressTimer);
    if (!locWasLong) handleLocClick();
  };
  el.onmouseleave = function() { clearTimeout(locPressTimer); };
}

function handleLocClick() {
  if (!navigator.geolocation) { toast('이 브라우저에서 위치를 지원하지 않아요'); return; }

  // 이미 추적 중이면 → 내 위치로 센터링만
  if (watchId !== null) {
    if (myLat !== null) {
      map.setCenter(new kakao.maps.LatLng(myLat, myLng));
      map.setLevel(4);
      toast('📍 내 위치로 이동');
    }
    return;
  }

  // 추적 시작
  toast('📍 위치 확인 중...');
  document.getElementById('locBtn').classList.add('tracking');

  navigator.geolocation.getCurrentPosition(pos => {
    myLat = pos.coords.latitude;
    myLng = pos.coords.longitude;
    updateMyLocMarker();
    map.setCenter(new kakao.maps.LatLng(myLat, myLng));
    map.setLevel(4);
    renderList();
    toast('📍 내 위치 표시 중 (길게 누르면 종료)');

    // 실시간 추적 시작
    watchId = navigator.geolocation.watchPosition(pos => {
      myLat = pos.coords.latitude;
      myLng = pos.coords.longitude;
      updateMyLocMarker();
      renderList();
    }, err => {}, { enableHighAccuracy: true, maximumAge: 5000 });
  }, err => {
    toast('위치를 가져올 수 없어요 (권한: ' + err.code + ')');
    document.getElementById('locBtn').classList.remove('tracking');
  }, { enableHighAccuracy: true, timeout: 15000 });
}

function stopTracking() {
  if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  document.getElementById('locBtn').classList.remove('tracking');
  if (myLocMarker) { myLocMarker.setMap(null); myLocMarker = null; }
  if (myLocOverlay) { myLocOverlay.setMap(null); myLocOverlay = null; }
  myLat = null; myLng = null;
  renderList();
  toast('위치 추적 종료');
}

function updateMyLocMarker() {
  if (!map || myLat === null) return;
  const pos = new kakao.maps.LatLng(myLat, myLng);
  if (!myLocOverlay) {
    const el = document.createElement('div');
    el.innerHTML = '<div style="width:16px;height:16px;background:#4285F4;border:3px solid white;border-radius:50%;box-shadow:0 0 8px rgba(66,133,244,.5)"></div>';
    myLocOverlay = new kakao.maps.CustomOverlay({ position: pos, content: el, zIndex: 999 });
    myLocOverlay.setMap(map);
  } else {
    myLocOverlay.setPosition(pos);
  }
}

function getDistanceKm(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2-lat1)*Math.PI/180;
  const dLng = (lng2-lng1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function formatDist(km) {
  if (km < 1) return Math.round(km*1000) + 'm';
  return km.toFixed(1) + 'km';
}

// ── 닉네임 ──
function saveNick() {
  const v = document.getElementById('nickInput').value.trim();
  if (!v) { toast('닉네임을 입력해주세요'); return; }
  myNick = v;
  localStorage.setItem('datemap-nick', myNick);
  document.getElementById('nickModal').classList.remove('open');
  renderAll();
}

function checkNick() {
  if (!myNick) document.getElementById('nickModal').classList.add('open');
}

function changeNick() {
  const v = document.getElementById('nickChange').value.trim();
  if (!v) { toast('닉네임을 입력해주세요'); return; }
  const oldNick = myNick;
  myNick = v;
  localStorage.setItem('datemap-nick', myNick);
  // 기존 별점의 닉네임도 변경
  places.forEach(p => {
    if (p.ratings && p.ratings[oldNick] !== undefined) {
      p.ratings[myNick] = p.ratings[oldNick];
      delete p.ratings[oldNick];
    }
  });
  saveData(); renderAll();
  document.getElementById('nickChange').value = myNick;
  toast('✅ 닉네임 변경됨');
}

// ── 별점 ──
function renderStars(placeId, nick, score) {
  let html = '';
  for (let i = 1; i <= 5; i++) {
    html += `<span class="star ${i<=score?'on':'off'}" onclick="event.stopPropagation();setRating(${placeId},'${nick}',${i})">★</span>`;
  }
  return html;
}

function setRating(placeId, nick, score) {
  if (nick !== myNick) { toast('본인 별점만 수정할 수 있어요'); return; }
  const p = places.find(x => x.id === placeId);
  if (!p) return;
  if (!p.ratings) p.ratings = {};
  p.ratings[nick] = score;
  saveData(); renderAll();
}

function getAvgRating(p) {
  if (!p.ratings) return null;
  const vals = Object.values(p.ratings);
  if (!vals.length) return null;
  return (vals.reduce((a,b) => a+b, 0) / vals.length).toFixed(1);
}

function renderRatingBlock(p) {
  if (!p.ratings) p.ratings = {};
  const nicks = [...Object.keys(p.ratings)];
  if (myNick && !nicks.includes(myNick)) nicks.push(myNick);
  const avg = getAvgRating(p);
  let html = '<div class="pi-rating">';
  if (avg) html += `<div class="pi-rating-avg">⭐ ${avg}</div>`;
  nicks.forEach(nick => {
    const score = p.ratings[nick] || 0;
    const isMe = nick === myNick;
    html += `<div class="pi-rating-row">
      <span class="pi-rating-name">${nick}</span>
      ${isMe ? renderStars(p.id, nick, score) : renderStarsReadonly(score)}
    </div>`;
  });
  html += '</div>';
  return html;
}

function renderStarsReadonly(score) {
  let html = '';
  for (let i = 1; i <= 5; i++) {
    html += `<span class="star ${i<=score?'on':'off'}" style="cursor:default">★</span>`;
  }
  return html;
}

function toast(msg) {
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2500);
}

// ── 시작 ──
window.addEventListener('load', () => {
  loadData();
  checkNick();
  startRealtimeSync();
  setupLocBtn();
  // 카카오 지도 SDK 동적 로드
  const script = document.createElement('script');
  script.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=fc85da8522a1e81f1e19c6777c002a55&autoload=false';
  script.onload = () => kakao.maps.load(initMap);
  document.head.appendChild(script);
  renderAll();
  lucide.createIcons();
});
</script>
